[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-override-adapter"
version = "0.3.2"
description = "NthLayer override-event sidecar — HTTP → nthlayer.reversal OTel log-record bridge"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # Floor is the version this repo is built and tested against, NOT the
    # oldest one that happens to import. Guarded by
    # tests/test_dependency_declarations.py and
    # tests/smoke/test_resolved_dependencies.py; see CLAUDE.md hard rule 16
    # for why both are needed [opensrm-p3bm].
    # WHY THE FLOOR (opensrm-wo62.1): the version this repo is now built and tested
    # against (rule 16: the floor is the installed sibling). Bump it on
    # every nthlayer-common minor release: the floor guard fails until you do.
    # [otel] (opensrm-a829): the OTel logs SDK and OTLP gRPC log exporter
    # that init_telemetry installs for the nthlayer.reversal log record. It
    # replaces the adapter's own opentelemetry-sdk / -exporter-otlp
    # dependencies, which served the span pipeline removed in 0.4.0.
    "nthlayer-common[otel]>=5.11.0,<6.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    # emission.py emits under an empty OTel context, so the event is unparented.
    "opentelemetry-api>=1.28",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.21",
]

[project.scripts]
nthlayer-override-adapter = "nthlayer_override_adapter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Imported directly by the two dependency guards, so declared rather than
    # leaned on as pytest's transitive dep [opensrm-p3bm].
    "packaging>=22",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
